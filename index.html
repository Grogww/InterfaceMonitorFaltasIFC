<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Monitor de Faltas — Redesign do SIGAA com melhorias de usabilidade baseadas nas Heurísticas de Nielsen.">
  <title>Monitor de Faltas | IFC — SIGAA Redesign</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Ícone da aba -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
</head>
<body>

  <!-- Atalho para o conteúdo principal -->
  <a href="#main" class="skip-link">Pular para o conteúdo principal</a>

  <!-- Cabeçalho -->
  <header class="header" role="banner">
    <div class="header__inner">
      <div class="header__brand">
        <div class="header__logo" aria-hidden="true">IFC</div>
        <div>
          <h1 class="header__title">Monitor de Faltas</h1>
          <p class="header__subtitle">Sistema de Acompanhamento de Frequência</p>
        </div>
      </div>
      <div class="header__meta">
        <span class="header__semester" id="header-semester">
          <!-- Semestre atual -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
          Semestre: 2026-1
        </span>
      </div>
    </div>
  </header>

  <!-- Conteúdo principal -->
  <main class="main" id="main">

    <!-- Área de busca -->
    <section class="search-section" aria-label="Busca de aluno">
      <div class="search-card">
        <h2 class="search-card__title">
          <!-- Ícone -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          Buscar Discente
        </h2>

        <div class="search-form" role="search">
          <!-- Campo de busca -->
          <div class="form-group">
            <label for="search-input">Nome ou Matrícula</label>
            <div class="autocomplete-wrapper">
              <input
                type="text"
                id="search-input"
                placeholder="Ex: Ana Clara ou 20230001"
                autocomplete="off"
                spellcheck="false"
                aria-describedby="input-hint"
                aria-autocomplete="list"
                aria-controls="autocomplete-list"
              >
              <!-- Sugestões -->
              <div class="autocomplete-list" id="autocomplete-list" role="listbox" aria-label="Sugestões de alunos"></div>
            </div>
            <!-- Mensagem do campo -->
            <span class="input-hint" id="input-hint"></span>
          </div>

          <!-- Período letivo -->
          <div class="form-group">
            <label for="select-periodo">Período Letivo</label>
            <select id="select-periodo" aria-label="Selecionar período letivo">
              <!-- Preenchido pelo JavaScript -->
            </select>
          </div>

          <!-- Botões da busca -->
          <div class="form-group" style="flex-direction:row; gap:0.5rem; align-self:end;">
            <button class="btn btn--primary" id="btn-buscar" type="button" aria-label="Buscar aluno">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
              </svg>
              Buscar
            </button>
            <!-- Limpa a busca -->
            <button class="btn btn--ghost" id="btn-limpar" type="button" aria-label="Limpar busca e resultados">
              Limpar
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Resultados carregados pelo JavaScript -->
    <div id="results-area" aria-live="polite"></div>

  </main>

  <!-- Painel lateral de detalhes -->
  <div class="detail-panel__overlay" id="detail-overlay" aria-hidden="true"></div>
  <aside class="detail-panel" id="detail-panel" role="dialog" aria-label="Detalhes da disciplina" aria-modal="true">
    <div class="detail-panel__header">
      <h3 class="detail-panel__title" id="detail-title">Detalhe</h3>
      <!-- Fechar painel -->
      <button class="detail-panel__close" id="detail-close" aria-label="Fechar painel de detalhes" title="Fechar (Esc)">✕</button>
    </div>
    <div class="detail-panel__body" id="detail-body"></div>
  </aside>

  <!-- Mensagens rápidas -->
  <div class="toast" id="toast" role="alert" aria-live="assertive"></div>

  <!-- Rodapé -->
  <footer class="footer">
    <p>
      Monitor de Faltas — Redesign baseado nas
      <a href="https://www.nngroup.com/articles/ten-usability-heuristics/" target="_blank" rel="noopener">
        10 Heurísticas de Nielsen
      </a>
      · Trabalho de IHC · IFC Campus Videira · 2026
    </p>
  </footer>

  <!-- Scripts da página -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
